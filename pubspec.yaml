name: gestor_producao_coco
description: Gestor de Produção e Comercialização de Coco - app offline (SQLite) para produtores rurais de coco.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: any
  pdf: ^3.11.0
  printing: ^5.13.0
  file_picker: ^13.4.0
  image_picker: ^1.1.2
  cryptography: ^2.7.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
